[project]
name = "autoresetlol"
version = "2.0.0"
description = "League of Legends desktop helper with LCU automation and screen dimming"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=5.2.2",
    "pillow>=12.0.0",
    "psutil>=7.1.3",
]

[dependency-groups]
build = [
    "pyinstaller>=6.17.0",
]
